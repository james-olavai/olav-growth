    <g transform="translate(80, 1220)">
        <rect width="920" height="72" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="2" stroke-dasharray="8 6"/>
        <text x="460" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="24" font-weight="600" fill="#58a6ff" text-anchor="middle">
            👉 评论区发送【知名Sa】，立即领取完整配套自查方案与
