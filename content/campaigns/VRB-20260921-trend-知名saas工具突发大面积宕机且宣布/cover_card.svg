        借势蹭流量 · 平替救火型 (The Rescuer) · 实操解构
    </text>

    <!-- Divider -->
    <line x1="80" y1="580" x2="1000" y2="580" stroke="#30363d" stroke-width="2"/>

    <!-- Structured Content Blocks -->
    
        <g transform="translate(80, 660)">
            <rect width="920" height="92" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
            <circle cx="48" cy="46" r="18" fill="#58a6ff" fill-opacity="0.15"/>
            <text x="48" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">1</text>
            <text x="90" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="28" font-weight="500" fill="#f0f6fc">第一步 (借势切入): 借【知名SaaS工具</text>
        </g>
        

        <g transform="translate(80, 775)">
            <rect width="920" height="92" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
            <circle cx="48" cy="46" r="18" fill="#58a6ff" fill-opacity="0.15"/>
            <text x="48" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">2</text>
            <text x="90" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="28" font-weight="500" fill="#f0f6fc">第二步 (穿透拆解): 揭示背后的底层技术规</text>
        </g>
        

        <g transform="translate(80, 890)">
            <rect width="920" height="92" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
            <circle cx="48" cy="46" r="18" fill="#58a6ff" fill-opacity="0.15"/>
            <text x="48" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#58a6ff" text-anchor="middle">3</text>
            <text x="90" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="28" font-weight="500" fill="#f0f6fc">第三步 (落地解法): 交付一套可直接上手的</text>
        </g>
        

    <!-- ================= BOTTOM SAFE ZONE (1180-1440px) ================= -->
