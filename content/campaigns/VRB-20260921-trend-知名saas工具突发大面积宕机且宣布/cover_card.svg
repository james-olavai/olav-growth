<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1440" width="1080" height="1440">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d1117"/>
            <stop offset="100%" stop-color="#161b22"/>
        </linearGradient>
    </defs>

    <!-- Canvas Background -->
    <rect width="1080" height="1440" fill="url(#bg-grad)"/>

    <!-- Decorative Top Wave / Grid -->
    <circle cx="1080" cy="0" r="400" fill="#58a6ff" fill-opacity="0.06"/>
    <circle cx="0" cy="1440" r="350" fill="#f78166" fill-opacity="0.04"/>

    <!-- ================= TOP SAFE ZONE (0-210px) ================= -->
    <!-- Brand / Badge Header (Safe from device status bar) -->
    <g transform="translate(80, 180)">
        <rect width="160" height="42" rx="21" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-width="1.5"/>
        <text x="80" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="20" font-weight="600" fill="#58a6ff" text-anchor="middle">紧急救火</text>
        <text x="920" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="20" font-weight="500" fill="#8b949e" text-anchor="end">01/05</text>
    </g>

    <!-- ================= ACTIVE CENTER (210-1180px) ================= -->
